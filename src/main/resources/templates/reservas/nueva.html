<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Reserva</title>
</head>
<body>
    <h1>Nueva Reserva</h1>

    <p th:if="${error}" th:text="${error}" style="color:red; font-weight:bold;"></p>

    <form th:action="@{/reservas}" th:object="${reserva}" method="post">

        <label>Laboratorio:
            <select th:field="*{laboratorioId}">
                <option th:each="lab : ${laboratorios}"
                        th:value="${lab.id}"
                        th:text="${lab.nombre}">Laboratorio</option>
            </select>
        </label>
        <br/>

        <label>Nombre solicitante:
            <input type="text" th:field="*{nombreSolicitante}"/>
        </label>
        <br/>

        <label>Correo solicitante:
            <input type="email" th:field="*{correoSolicitante}"/>
        </label>
        <br/>

        <label>Inicio:
            <input type="datetime-local" th:field="*{inicio}"/>
        </label>
        <br/>

        <label>Fin:
            <input type="datetime-local" th:field="*{fin}"/>
        </label>
        <br/>

        <label>Motivo:
            <input type="text" th:field="*{motivo}"/>
        </label>
        <br/>

        <button type="submit">Reservar</button>
    </form>

    <p><a th:href="@{/reservas}">Volver al listado</a></p>
</body>
</html>
